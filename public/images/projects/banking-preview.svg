<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="16" fill="#F8FAFC"/>
  <!-- Top App Bar -->
  <rect width="600" height="54" rx="16" fill="#064E3B"/>
  <circle cx="28" cy="27" r="7" fill="#10B981"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">IBM Prototype • Credit Risk &amp; Cross-Sell</text>
  <rect x="430" y="15" width="145" height="24" rx="12" fill="#047857"/>
  <text x="444" y="31" fill="#D1FAE5" font-family="sans-serif" font-weight="600" font-size="11">Case Study Model</text>

  <!-- Left Card: Risk Assessment -->
  <rect x="24" y="74" width="260" height="264" rx="12" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
  <text x="42" y="102" fill="#064E3B" font-family="sans-serif" font-weight="700" font-size="15">Default Probability Gauge</text>
  
  <!-- Gauge Arc Visualization -->
  <path d="M70 180 A 60 60 0 0 1 230 180" stroke="#E2E8F0" stroke-width="14" fill="none"/>
  <path d="M70 180 A 60 60 0 0 1 170 125" stroke="#10B981" stroke-width="14" fill="none"/>
  <text x="135" y="170" fill="#064E3B" font-family="sans-serif" font-weight="800" font-size="28" text-anchor="middle">14.2%</text>
  <text x="135" y="190" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">LOW DEFAULT RISK</text>

  <!-- Risk Factors -->
  <rect x="42" y="210" width="224" height="28" rx="6" fill="#ECFDF5"/>
  <text x="54" y="228" fill="#064E3B" font-family="sans-serif" font-size="11">Debt-to-Income (DTI): 22% (Optimal)</text>

  <rect x="42" y="244" width="224" height="28" rx="6" fill="#ECFDF5"/>
  <text x="54" y="262" fill="#064E3B" font-family="sans-serif" font-size="11">Credit Utilization: 18% (Healthy)</text>

  <rect x="42" y="278" width="224" height="28" rx="6" fill="#ECFDF5"/>
  <text x="54" y="296" fill="#064E3B" font-family="sans-serif" font-size="11">Repayment Consistency: 99.4%</text>

  <rect x="42" y="312" width="224" height="18" rx="4" fill="#064E3B"/>
  <text x="52" y="324" fill="#D1FAE5" font-family="sans-serif" font-size="9" font-weight="600">Decision: Recommended for Underwriting Approval</text>

  <!-- Right Card: Cross-Sell Recommendations -->
  <rect x="304" y="74" width="272" height="264" rx="12" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
  <text x="322" y="102" fill="#064E3B" font-family="sans-serif" font-weight="700" font-size="15">Cross-Sell Engine Matches</text>
  <text x="322" y="120" fill="#64748B" font-family="sans-serif" font-size="11">Propensity-based product recommendations</text>

  <!-- Product 1 -->
  <rect x="322" y="134" width="236" height="54" rx="8" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="336" y="156" fill="#064E3B" font-family="sans-serif" font-weight="700" font-size="12">Platinum Cashback Card</text>
  <text x="336" y="174" fill="#64748B" font-family="sans-serif" font-size="10">Match Score: 94% • High credit surplus</text>
  <rect x="496" y="148" width="52" height="24" rx="6" fill="#10B981"/>
  <text x="506" y="164" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">Target</text>

  <!-- Product 2 -->
  <rect x="322" y="196" width="236" height="54" rx="8" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="336" y="218" fill="#064E3B" font-family="sans-serif" font-weight="700" font-size="12">Pre-Approved Auto Loan</text>
  <text x="336" y="236" fill="#64748B" font-family="sans-serif" font-size="10">Match Score: 88% • Prime interest tier</text>
  <rect x="496" y="210" width="52" height="24" rx="6" fill="#10B981"/>
  <text x="506" y="226" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">Target</text>

  <!-- Product 3 -->
  <rect x="322" y="258" width="236" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="336" y="280" fill="#1F2937" font-family="sans-serif" font-weight="700" font-size="12">High-Yield Wealth Account</text>
  <text x="336" y="298" fill="#64748B" font-family="sans-serif" font-size="10">Match Score: 78% • Secondary queue</text>
  <rect x="496" y="272" width="52" height="24" rx="6" fill="#94A3B8"/>
  <text x="506" y="288" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">Queue</text>
</svg>

